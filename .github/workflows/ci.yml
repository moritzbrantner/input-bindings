name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo package --locked -p input-bindings-core

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:fast
      - run: bun run secrets:check
      - run: bun run test:ts
      - run: bun run pack:packages
      - run: bun run --cwd packages/input-bindings-demo build

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run build:storybook
      - run: bun run test:storybook:built
      - name: Upload Storybook browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-browser-evidence
          path: test-results/storybook
          if-no-files-found: warn
          retention-days: 7

  browser-quality:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/browser-quality.yml

  release-artifacts:
    permissions:
      contents: write
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/release.yml

  package-distribution:
    permissions:
      contents: write
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/package-dist.yml

  merge-ready:
    name: merge-ready
    if: always()
    needs: ["rust", "typescript", "storybook", "browser-quality", "release-artifacts", "package-distribution"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["rust", "typescript", "storybook", "browser-quality", "release-artifacts", "package-distribution"]'
          allow-skipped: ${{ github.event_name != 'pull_request' && '["browser-quality", "release-artifacts", "package-distribution"]' || '[]' }}
