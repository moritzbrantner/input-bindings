name: Release artifacts

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: bun install --frozen-lockfile

      - name: Build first artifact set
        if: github.ref_type != 'tag'
        run: bun run release:artifacts --output "$RUNNER_TEMP/release-a"
      - name: Build first tagged artifact set
        if: github.ref_type == 'tag'
        run: bun run release:artifacts --version "${GITHUB_REF_NAME#v}" --output "$RUNNER_TEMP/release-a"

      - name: Remove intermediate build outputs
        run: rm -rf packages/input-bindings-demo/dist target/package

      - name: Build second artifact set
        if: github.ref_type != 'tag'
        run: bun run release:artifacts --output "$RUNNER_TEMP/release-b"
      - name: Build second tagged artifact set
        if: github.ref_type == 'tag'
        run: bun run release:artifacts --version "${GITHUB_REF_NAME#v}" --output "$RUNNER_TEMP/release-b"

      - name: Verify byte-for-byte reproducibility
        run: diff -qr "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: input-bindings-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-a/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: input-bindings-release-${{ github.sha }}
          path: release
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --verify-tag --title "$tag" --generate-notes
          fi
