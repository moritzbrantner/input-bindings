name: Release artifacts

on:
  workflow_call:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bun install --frozen-lockfile

      - name: Build first artifact set
        if: github.ref_type != 'tag'
        run: bun run release:artifacts --output "$RUNNER_TEMP/release-a"
      - name: Build first tagged artifact set
        if: github.ref_type == 'tag'
        run: bun run release:artifacts --version "${GITHUB_REF_NAME#v}" --output "$RUNNER_TEMP/release-a"

      - name: Remove intermediate build outputs
        run: rm -rf packages/input-bindings-demo/dist target/package

      - name: Build second artifact set
        if: github.ref_type != 'tag'
        run: bun run release:artifacts --output "$RUNNER_TEMP/release-b"
      - name: Build second tagged artifact set
        if: github.ref_type == 'tag'
        run: bun run release:artifacts --version "${GITHUB_REF_NAME#v}" --output "$RUNNER_TEMP/release-b"

      - name: Verify byte-for-byte reproducibility
        run: diff -qr "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: input-bindings-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-a/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: input-bindings-release-${{ github.sha }}
          path: release
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --verify-tag --title "$tag" --generate-notes
          fi
