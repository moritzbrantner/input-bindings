name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: bun install --frozen-lockfile
      - run: mkdir -p benchmark-results
      - name: Capture environment
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            node --version
            rustc --version
            cargo --version
            uname -a
            lscpu
          } > benchmark-results/environment.txt
      - name: Run TypeScript benchmarks
        run: bun run bench:ts benchmark-results/typescript.json
      - name: Run Rust benchmarks
        run: bun run bench:rust benchmark-results/rust.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: input-bindings-benchmarks-${{ github.sha }}
          path: benchmark-results/
          retention-days: 90
