name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bun install --frozen-lockfile
      - run: mkdir -p benchmark-results
      - name: Capture environment
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            node --version
            rustc --version
            cargo --version
            uname -a
            lscpu
          } > benchmark-results/environment.txt
      - name: Run TypeScript benchmarks
        run: bun run bench:ts benchmark-results/typescript.json
      - name: Run Rust benchmarks
        run: bun run bench:rust benchmark-results/rust.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: input-bindings-benchmarks-${{ github.sha }}
          path: benchmark-results/
          retention-days: 90
