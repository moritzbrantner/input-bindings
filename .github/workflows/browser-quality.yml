name: Browser Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run test:storybook
      - name: Upload Storybook evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-storybook
          path: test-results/storybook
          if-no-files-found: warn
          retention-days: 7

  pages-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run test:pages
      - name: Upload Pages browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-pages
          path: test-results/pages
          if-no-files-found: warn
          retention-days: 7

  unlighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:pages
      - name: Start built Pages preview
        run: |
          bun run --cwd packages/input-bindings-demo preview > /tmp/input-bindings-vite.log 2>&1 &
          echo $! > /tmp/input-bindings-vite.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/input-bindings/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/input-bindings-vite.log
          exit 1
      - name: Install Unlighthouse
        run: bun add --global @unlighthouse/cli@0.18.1 puppeteer@25.11.0
      - name: Audit mobile Pages
        run: |
          unlighthouse-ci \
            --site http://127.0.0.1:4173 \
            --urls /input-bindings/ \
            --mobile \
            --disable-sitemap \
            --disable-robots-txt \
            --build-static
      - name: Upload Unlighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-unlighthouse
          path: .unlighthouse
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
